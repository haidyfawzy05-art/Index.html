<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تهنئة خاصة</title>
<style>
body {
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff5f7 0%, #ffe9ee 100%);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: center;
  overflow: hidden;
  position: relative;
}
.floating-decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.float-item {
  position: absolute;
  bottom: -40px;
  font-size: 22px;
  opacity: 0.35;
  animation: floatUp linear infinite;
}
.float-item:nth-child(1) { left: 10%; animation-duration: 9s; animation-delay: 0s; font-size: 24px; }
.float-item:nth-child(2) { left: 26%; animation-duration: 11s; animation-delay: 2s; font-size: 20px; }
.float-item:nth-child(3) { left: 45%; animation-duration: 10s; animation-delay: 4s; font-size: 26px; }
.float-item:nth-child(4) { left: 68%; animation-duration: 12s; animation-delay: 1s; font-size: 22px; }
.float-item:nth-child(5) { left: 85%; animation-duration: 9.5s; animation-delay: 3s; font-size: 24px; }

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% {
    opacity: 0.35;
  }
  85% {
    opacity: 0.35;
  }
  100% {
    transform: translateY(-110vh) rotate(15deg);
    opacity: 0;
  }
}

#main-content {
  position: relative;
  z-index: 1;
  background: white;
  padding: 40px 25px;
  border-radius: 30px;
  box-shadow: 0 10px 40px rgba(255, 71, 87, 0.12);
  border-top: 6px solid #ff4757;
  max-width: 420px;
  margin: 20px;
  animation: fadeIn 1.2s ease-out;
}
h1 {
  color: #ff4757;
  font-size: 26px;
  margin-bottom: 25px;
}
p {
  color: #444;
  font-size: 18px;
  line-height: 1.8;
  margin: 12px 0;
}
.special-line {
  color: #ff6b81;
  font-weight: bold;
  font-size: 20px;
  margin-top: 20px;
  border-top: 1px dashed #ffd1d1;
  padding-top: 15px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="floating-decor" aria-hidden="true">
  <span class="float-item">🎈</span>
  <span class="float-item">🤍</span>
  <span class="float-item">🎈</span>
  <span class="float-item">❤️</span>
  <span class="float-item">🎈</span>
</div>

<div id="main-content">
  <h1>كل سنة وأنت طيب يا إسلام 🎂</h1>
  <p>بداية سنة جديدة ربنا يجعلها عوض ليك عن كل اللي عدا 🤍</p>
  <p>أتمنى لك أيام حلوة زيك تفرح قلبك ❤️</p>
  <p>وعقبال ١٠٠ سنة يارب 🎈</p>
  <p>وأنت محقق اللي بتتمناه 🤲</p>
  <p>ربنا يديم ضحكتك ع وشك ❤️</p>
  <p class="special-line">ومتضايقش ع الماتش 🔪</p>
</div>
</body>
</html>
