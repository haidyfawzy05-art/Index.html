<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية الرقمية | هايدي فوزي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* إضافة صورة خلفية تعبر عن التكنولوجيا */
            background-image: url('https://images.unsplash.com/photo-1510218830377-0e9d01d4944d?q=80&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* طبقة تظليل فوق الصورة لجعل المحتوى واضحاً */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); /* تعتيم الخلفية بنسبة 50% */
            z-index: -1;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95); /* خلفية بيضاء شفافة قليلاً */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: #004586;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .logo {
            width: 100px;
            background: white;
            padding: 10px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .main-content {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            font-size: 1.1em;
        }

        .label {
            font-weight: bold;
            color: #004586;
            width: 40%;
        }

        .btn-contact {
            display: block;
            background: #e67e22;
            color: white;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-contact:hover {
            background: #d35400;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9em;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/ar/0/03/Ain_Shams_University_Logo.png" alt="شعار الجامعة" class="logo">
        <h1 style="margin:0;">هايدي فوزي محمد محمد</h1>
        <p style="margin:5px 0 0; opacity: 0.9;">قسم تكنولوجيا التعليم الرقمي</p>
    </div>

    <div class="main-content">
        <table>
            <tr>
                <td class="label">الكلية:</td>
                <td>كلية التربية</td>
            </tr>
            <tr>
                <td class="label">المقرر:</td>
                <td>تصميم مواقع</td>
            </tr>
            <tr>
                <td class="label">الدكتور:</td>
                <td>د. محمد عنتر</td>
            </tr>
            <tr>
                <td class="label">المستوى:</td>
                <td>الثالث (فصل 2)</td>
            </tr>
            <tr>
                <td class="label">الإيميل:</td>
                <td style="font-size: 0.8em;">free_edu2324049@edu.asu.edu.eg</td>
            </tr>
        </table>

        <a href="mailto:free_edu2324049@edu.asu.edu.eg" class="btn-contact">تواصل معي بالبريد الجامعي</a>
    </div>
</div>

<footer style="position: relative; margin-top: 20px;">
    مشروع مقرر تصميم المواقع &copy; 2025
</footer>

</body>
</html>
